name: core-tests

# Unity 라이선스 없이 도는 빠른 검증: 순수 C# Core + EditMode 테스트(NUnit)를 .NET으로 컴파일·실행한다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test TowerGlide.Core
        run: dotnet test tools/core-tests --logger "console;verbosity=normal"
